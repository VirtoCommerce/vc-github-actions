version: 2
updates:
  # GitHub Actions referenced from workflows (.github/workflows) and from every
  # composite action.yml in the repo.
  - package-ecosystem: github-actions
    directories: ["/**"]
    # deprecated/ holds retired actions + disabled workflows — not maintained.
    exclude-paths: ["deprecated/**"]
    schedule:
      interval: weekly
    groups:
      actions:
        # group-by dependency-name collapses the same action bump across every
        # directory it appears in into ONE pull request, instead of Dependabot's
        # default of one grouped PR per directory.
        group-by: dependency-name
        patterns:
          - "*"

  # Bundled Node actions: every directory with a package.json. group-by
  # dependency-name consolidates a given package bump across all action folders
  # into a single PR. Minor + patch are grouped; majors still arrive separately
  # (one PR per package) so each can be canary-tested.
  - package-ecosystem: npm
    directories:
      - "/*"
    # deprecated/ node actions are not maintained.
    exclude-paths:
      - "deprecated/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "major"

  # exclude-paths above only scopes VERSION updates. Security updates are driven
  # by Dependabot alerts and scan every manifest in the repo regardless of
  # directories/exclude-paths, so retired actions kept opening PRs anyway. The
  # one setting they do honor is ignore, hence these no-op entries whose only
  # job is to carry an ignore-everything rule for deprecated/.
  - package-ecosystem: npm
    # ** (not *) so nested manifests are covered too: retired ADO task
    # extensions keep their package.json a level deeper than the action
    # folder (deprecated/backendPack/backendPack/package.json).
    directories:
      - "/deprecated/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directories: ["/deprecated/**"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
