# Search overlay: Elasticsearch 8.x — the action's default `searchProvider`.
# Needs the VirtoCommerce.ElasticSearch8 module. Combine with docker-compose.yml + a <db> overlay;
# the base supplies the engine-agnostic ports/limits/healthcheck and the searchdata volume.
services:

  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.18.0}
    volumes:
      - searchdata:/usr/share/elasticsearch/data
    environment:
      - node.name=search
      - cluster.name=${CLUSTER_NAME:-elasticsearch}
      - cluster.initial_master_nodes=search
      - ELASTIC_PASSWORD=${SEARCH_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=${LICENSE:-basic}
      - xpack.ml.use_auto_machine_memory_percent=true

  vc-platform-web:
    environment:
      - Search:Provider=ElasticSearch8
      - Search:ElasticSearch8:Server=http://search:${SEARCH_PORT:-9200}
      - Search:ElasticSearch8:User=elastic
      - Search:ElasticSearch8:Key=${SEARCH_PASSWORD}
      # Carried over from the previous hard-coded config, to preserve behaviour.
      - Search:ElasticSearch8:EnableCompatibilityMode=true
