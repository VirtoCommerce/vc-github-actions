# Search overlay: OpenSearch 2.x.
# Selected by the action's `searchProvider: opensearch` input.
# Requires the VirtoCommerce.OpenSearch module in the platform image — the action
# cannot verify that, so the platform fails on startup if it is missing.
# Always combined with docker-compose.yml and a docker-compose.<db>.yml overlay.
#
# The service is named `search`, not after the engine, so the base file's depends_on, the
# wait-for-it entrypoints in the db overlays and the platform's Server URL stay engine-agnostic.
services:

  search:
    image: opensearchproject/opensearch:${STACK_VERSION:-2.18.0}
    volumes:
      - searchdata:/usr/share/opensearch/data
    ports:
      - ${SEARCH_PORT:-9200}:9200
    networks:
      - virto
    environment:
      - node.name=search
      - cluster.name=${CLUSTER_NAME:-opensearch}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Required. Elasticsearch sizes its heap from the container's cgroup limit, so it fits
      # MEM_LIMIT automatically; OpenSearch ships a fixed -Xms1g/-Xmx1g in jvm.options, which
      # against mem_limit=1g gets the container OOM-killed (exit 137) before it ever binds 9200.
      # 512m mirrors what Elasticsearch picks for itself at the same limit.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Second JVM, useless for CI and pure memory pressure inside the same limit.
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      # No TLS and no auth, matching how the Elasticsearch overlays run.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Unused while the security plugin is off, but the image's entrypoint still
      # validates it is set on 2.12+.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SEARCH_PASSWORD}
    mem_limit: ${MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:${SEARCH_PORT:-9200}",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  vc-platform-web:
    environment:
      - Search:Provider=OpenSearch
      # Search:OpenSearch:User / :Password are intentionally unset — the security
      # plugin is disabled above, so the server accepts unauthenticated requests.
      - Search:OpenSearch:Server=http://search:${SEARCH_PORT:-9200}

volumes:
  searchdata:
    driver: local

networks:
  virto:
