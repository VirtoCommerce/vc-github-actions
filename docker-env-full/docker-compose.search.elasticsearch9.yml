# Search overlay: Elasticsearch 9.x (`searchProvider: elasticsearch9`).
# Needs the VirtoCommerce.ElasticSearch9 module — unverifiable here, so a missing one surfaces
# only as a platform startup failure. Combine with docker-compose.yml + a <db> overlay;
# the base supplies the engine-agnostic ports/limits/healthcheck and the searchdata volume.
services:

  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.1}
    volumes:
      - searchdata:/usr/share/elasticsearch/data
    environment:
      - node.name=search
      - cluster.name=${CLUSTER_NAME:-elasticsearch}
      - cluster.initial_master_nodes=search
      - ELASTIC_PASSWORD=${SEARCH_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=${LICENSE:-basic}
      - xpack.ml.use_auto_machine_memory_percent=true

  vc-platform-web:
    environment:
      - Search:Provider=ElasticSearch9
      - Search:ElasticSearch9:Server=http://search:${SEARCH_PORT:-9200}
      - Search:ElasticSearch9:User=elastic
      - Search:ElasticSearch9:Key=${SEARCH_PASSWORD}
