# Search overlay: Elasticsearch 9.x.
# Selected by the action's `searchProvider: elasticsearch9` input.
# Requires the VirtoCommerce.ElasticSearch9 module in the platform image — the action
# cannot verify that, so the platform fails on startup if it is missing.
# Always combined with docker-compose.yml and a docker-compose.<db>.yml overlay.
services:

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.1}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT:-9200}:9200
    networks:
      - virto
    environment:
      - node.name=es
      - cluster.name=${CLUSTER_NAME:-elasticsearch}
      - cluster.initial_master_nodes=es
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=${LICENSE:-basic}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:${ES_PORT:-9200}",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  vc-platform-web:
    environment:
      - Search:Provider=ElasticSearch9
      - Search:ElasticSearch9:Server=http://es:${ES_PORT:-9200}
      - Search:ElasticSearch9:User=elastic
      - Search:ElasticSearch9:Key=${ELASTIC_PASSWORD}

volumes:
  esdata01:
    driver: local

networks:
  virto:
