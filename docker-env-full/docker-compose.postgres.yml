services:

  vc-db:
    image: postgres:${PGSQL_VERSION:-18.3}
    ports:
      - "${PGSQL_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=VirtoCommerce3docker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    # -d <seeded db>, so the probe passes only once initdb created it — not as soon as the
    # postmaster accepts connections.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d VirtoCommerce3docker" ]
      interval: 10s
      timeout: 10s
      retries: 30

  vc-platform-web:
    environment:
      - DatabaseProvider=PostgreSql
      - ConnectionStrings:VirtoCommerce=User ID=postgres;Password=${DB_PASSWORD};Host=vc-db;Port=5432;Database=VirtoCommerce3docker

volumes:
  postgres_data:
    driver: local

