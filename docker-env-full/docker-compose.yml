# Base file. Provider-specific pieces live in overlays and must always be combined
# with this file:
#   * vc-db + the vc-platform-web DB connection string -> docker-compose.<db>.yml
#   * the es service + the vc-platform-web Search:* keys -> docker-compose.search.<engine>.yml
# e.g.
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.sqlserver.yml \
#                  -f docker-compose.search.elasticsearch8.yml up -d
#
# The esdata01 volume below stays in the base because every search overlay mounts it.

services:

  nginx_frontend:
    depends_on:
      - vc-platform-web
    image: nginx_frontend:local-latest
    ports:
      - "${DOCKER_FRONTEND_PORT:-80}:80"
    networks:
      - virto

  vc-platform-web:
    image: platform:local-latest
    ports:
      - "${DOCKER_PLATFORM_PORT:-8090}:80"
    environment:
      - ApplicationInsights:InstrumentationKey=${APPLICATIONINSIGHTS_INSTRUMENTATIONKEY}
      - ASPNETCORE_URLS=http://+
      - VirtoCommerce:AllowInsecureHttp=true
      - VirtoCommerce:Hangfire:JobStorageType=Memory
      - VirtoCommerce:ApplicationInsights:RoleName=${ROLE_NAME}
      - Assets:FileSystem:PublicUrl=http://localhost:${DOCKER_PLATFORM_PORT:-8090}/assets/
      - Content:FileSystem:PublicUrl=http://localhost:${DOCKER_PLATFORM_PORT:-8090}/cms-content/
      - Search:PickupLocationFullTextSearchEnabled=true
      - IdentityOptions:User:MaxPasswordAge=0
      - Notifications:DefaultSender=virto.start@virtoway.com
      - Notifications:Gateway=SendGrid
      - Notifications:SendGrid:ApiKey=${SENDGRID_API_KEY}
    depends_on:
      - es
    volumes:
      - cms-content-volume:/opt/virtocommerce/platform/wwwroot/cms-content
      - modules-volume:/opt/virtocommerce/platform/modules
    networks:
      - virto
    restart: unless-stopped

volumes:
  cms-content-volume:
    name: cms-content-data
  modules-volume:
    name: modules-data
  esdata01:
    driver: local

networks:
  virto:
