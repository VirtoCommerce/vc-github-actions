name: "Update docs.virtocommerce.org (Versioned)"
description: "Makes and updates versioned documentation for docs.virtocommerce.org using Mike"
outputs:
  docker-image-tag:
    description: "Docker image tag that was used for the build"
    value: ${{ steps.docker-tag.outputs.tag }}
inputs:
  githubToken:
    description: "GitHub token with push permissions to gh-pages branch"
    required: true
  ref:
    description: "Branch of vc-docs to deploy (main or release/stableNN). VERSION file on that ref determines the deployed version, not the branch name."
    required: false
    default: "main"
  setAsLatest:
    description: "Set this version as 'latest' alias"
    required: false
    default: "true"
  setAsDefault:
    description: "Set this version as default version"
    required: false
    default: "true"
  dockerRegistry:
    description: "Docker Registry"
    required: true
  dockerUsr:
    description: "Docker User"
    required: true
  dockerPwd:
    description: "Docker Password"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout vc-docs repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: VirtoCommerce/vc-docs
        ref: ${{ inputs.ref }}
        path: vc-docs
        fetch-depth: 0
        token: ${{ inputs.githubToken }}
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"

    - name: Install MkDocs and Mike
      shell: bash
      working-directory: ${{ github.workspace }}/vc-docs
      run: |
        # Install the exact dependency set pinned by vc-docs so the CI build
        # never drifts from local builds and the Build check workflow.
        pip install -r requirements-docs.txt

    - name: Configure Git
      shell: bash
      working-directory: ${{ github.workspace }}/vc-docs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Build and deploy versioned documentation
      shell: bash
      working-directory: ${{ github.workspace }}/vc-docs
      run: |
        VERSION=$(tr -d '[:space:]' < VERSION)
        if [ -z "$VERSION" ]; then
          echo "❌ VERSION file is empty or missing at vc-docs root"
          exit 1
        fi
        echo "Deploying version $VERSION from ref ${{ inputs.ref }}"
        echo "Set as latest: ${{ inputs.setAsLatest }}"
        echo "Set as default: ${{ inputs.setAsDefault }}"

        ARGS=(--version "$VERSION")
        if [ "${{ inputs.setAsLatest }}" = "true" ]; then
          ARGS+=(--set-as-latest)
        fi
        if [ "${{ inputs.setAsDefault }}" = "true" ]; then
          ARGS+=(--set-as-default)
        fi

        python3 versioned-build-cicd.py "${ARGS[@]}"
        echo "✓ Deployment completed"

    - name: Verify build output
      shell: bash
      working-directory: ${{ github.workspace }}/vc-docs
      run: |
        echo "Verifying build output..."

        # Check if site directory exists and has content
        if [ -d "site" ]; then
          echo "✓ Site directory created"
          echo "Site contents:"
          ls -la site/
        else
          echo "❌ Site directory not found"
          exit 1
        fi

        # Check if build-info.json exists
        if [ -f "build-info.json" ]; then
          echo "✓ Build info file created"
          cat build-info.json
        else
          echo "⚠️  Build info file not found"
        fi

    - name: Prepare Docker context
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Copy versioned site directory for Docker
        cp -r vc-docs/site ./

        # Copy Docker files
        cp -r ${{ github.action_path }}/docker/* ./

        echo "✓ Docker context prepared"
        echo "=== DOCKER CONTEXT DEBUG ==="
        echo "Site directory contents:"
        ls -la site/ | head -20
        echo "Docker files:"
        ls -la Dockerfile nginx.versioned.conf
        echo "============================="

    - name: Determine Docker Image Tag
      id: docker-tag
      shell: bash
      working-directory: ${{ github.workspace }}/vc-docs
      run: |
        VERSION=$(tr -d '[:space:]' < VERSION)
        if [ -z "$VERSION" ]; then
          echo "❌ VERSION file is empty or missing at vc-docs root"
          exit 1
        fi
        TAG="versioned-${VERSION}-${{ github.run_number }}"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Docker image tag: $TAG"

    # Buildx with the docker-container driver, because the default docker driver
    # cannot export straight to a registry, which is what the reproducible
    # output below requires.
    - name: Set up Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build and Push Docker image
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # Reproducible layers. Without SOURCE_DATE_EPOCH and rewrite-timestamp,
        # BuildKit stamps build time into every layer, so two builds of identical
        # content produce different digests and the registry stores a complete
        # copy of the image per tag instead of sharing what did not change.
        # Measured on 1.2 GB of real documentation: without the pair, 6 of 12
        # blobs differed between two identical builds; with it, all matched.
        # Normalizing file mtimes in the build context does NOT substitute for
        # this, which was verified separately.
        SOURCE_DATE_EPOCH: "0"
        DOCKER_REGISTRY: ${{ inputs.dockerRegistry }}
        DOCKER_USER: ${{ inputs.dockerUsr }}
        DOCKER_PASSWORD: ${{ inputs.dockerPwd }}
        IMAGE_TAG: ${{ steps.docker-tag.outputs.tag }}
      run: |
        set -euo pipefail

        echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USER" --password-stdin

        docker buildx build \
          --file ./Dockerfile \
          --pull \
          --tag "$DOCKER_REGISTRY/vcpt/docs:$IMAGE_TAG" \
          --output "type=registry,rewrite-timestamp=true" \
          .

        echo "✓ Pushed $DOCKER_REGISTRY/vcpt/docs:$IMAGE_TAG"
